<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Golf Slip Tracker</title>
<style>
:root{--bg:#090b0a;--card:#151917;--line:#2b332f;--text:#fff;--muted:#a8b0ab;--green:#39e58c;--yellow:#ffd34d;--red:#ff6b7a;--blue:#79d7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px}header{position:sticky;top:0;z-index:10;background:#090b0af2;border-bottom:1px solid var(--line);padding:14px 16px 10px}h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:4px}.statusbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}.live-dot{color:var(--green);font-weight:800}main{padding:12px 12px 90px;max-width:760px;margin:auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.sum span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.sum b{display:block;font-size:19px;margin-top:3px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.tab{padding:11px 8px;border:1px solid var(--line);background:#111411;color:var(--muted);border-radius:12px;font-weight:800}.tab.active{background:#fff;color:#000}.panel{display:none}.panel.active{display:block}.slip{background:var(--card);border:1px solid var(--line);border-radius:17px;margin-bottom:12px;overflow:hidden}.slipHead{padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.slipTitle{font-size:18px;font-weight:900;line-height:1.2}.slipMeta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.4}.odds{font-size:21px;font-weight:950;text-align:right;white-space:nowrap}.editBtn{margin-top:7px;border:1px solid var(--line);background:#242a27;color:#fff;border-radius:9px;padding:7px 10px;font-weight:800}.money{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{padding:10px 12px}.metric+ .metric{border-left:1px solid var(--line)}.metric span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric b{font-size:17px}.leg{padding:13px 14px;border-top:1px solid #242a27}.leg:first-of-type{border-top:0}.legTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.player{font-size:18px;font-weight:850}.pos{font-size:17px;font-weight:950}.scores{display:flex;gap:14px;margin-top:6px;color:var(--muted);font-size:14px}.pill{display:inline-block;margin-top:8px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.wait{background:#24314a;color:#cfe1ff}.live{background:#49370a;color:#ffe899}.hit{background:#0b5138;color:#b8fbd7}.miss{background:#541421;color:#ffd0d6}.playerCard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px}.pcTop{display:flex;justify-content:space-between;gap:10px}.pcName{font-size:18px;font-weight:900}.pcPos{font-size:20px;font-weight:950}.pcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.pcStat{background:#0d100e;border-radius:9px;padding:8px;text-align:center}.pcStat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.pcStat b{font-size:16px}.controls{display:grid;gap:9px}.bigBtn,input{width:100%;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:13px;font:inherit}.bigBtn{font-weight:900;text-align:left}.primary{background:#fff;color:#000}.danger{background:#4a1019}.help{color:var(--muted);font-size:14px;line-height:1.45;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0c0bf2;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px}.bottom button{border:0;border-radius:12px;padding:13px;font-weight:950;font-size:16px}.refresh{background:var(--green);color:#062113}.add{background:#fff;color:#000}dialog{width:min(94%,720px);max-height:88vh;overflow:auto;background:#111512;color:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{color:var(--muted);font-size:13px}.formgrid input{margin-top:4px;padding:10px}.wide{grid-column:1/-1}.legEdit{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:850;background:#222824;color:#fff}@media(max-width:420px){body{font-size:16px}.summary{grid-template-columns:repeat(3,1fr)}.sum{padding:8px}.sum b{font-size:17px}.pcGrid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><h1>Rocket Classic Slip Tracker</h1><div class="sub">Large-text mobile view</div><div class="statusbar"><span id="feedStatus">Loading scores…</span><span id="updated"></span></div></header><main>
<section class="summary" id="summary"></section>
<nav class="tabs"><button class="tab active" data-tab="slips">Slips</button><button class="tab" data-tab="players">Players</button><button class="tab" data-tab="manage">Manage</button></nav>
<section id="slips" class="panel active"><div id="slipCards"></div></section>
<section id="players" class="panel"><div id="playerCards"></div></section>
<section id="manage" class="panel"><div class="controls"><button class="bigBtn primary" onclick="openEditor()">＋ Add Slip Manually</button><button class="bigBtn" onclick="imgInput.click()">📷 Scan Slip Screenshot</button><input id="imgInput" type="file" accept="image/*" multiple hidden onchange="scanImages(this.files)"><button class="bigBtn" onclick="exportJSON()">⬇ Export Slip Backup</button><button class="bigBtn" onclick="jsonInput.click()">⬆ Import Slip Backup</button><input id="jsonInput" type="file" accept="application/json" hidden onchange="importJSON(this.files[0])"><button class="bigBtn danger" onclick="resetDemo()">Reset to Weekend Slips</button><input id="boardUrl" value="leaderboard.json"><div class="help">Your slips stay saved on this phone. The tracker first checks your leaderboard URL, then automatically falls back to ESPN.</div></div></section>
</main><div class="bottom"><button class="refresh" onclick="loadBoard()">↻ Refresh Scores</button><button class="add" onclick="openEditor()">＋ Add Slip</button></div>
<dialog id="editor"><form method="dialog" onsubmit="return false"><h2 id="editorTitle">Add Slip</h2><div class="formgrid"><label>Event<input id="fEvent" value="Rocket Classic"></label><label>Book<input id="fBook" value="Fanatics"></label><label>Odds<input id="fOdds" type="number" value="100"></label><label>Wager<input id="fWager" type="number" step=".01" value="1"></label><label>Payout<input id="fPayout" type="number" step=".01" value="2"></label><label>Cashout<input id="fCash" type="number" step=".01" value="0"></label><label class="wide">Bet ID<input id="fBet"></label><label class="wide">Slip Name<input id="fName"></label></div><h3>Players</h3><div id="legsEditor"></div><button type="button" class="bigBtn" onclick="addLegRow()">＋ Add Player</button><div class="row" style="margin-top:12px"><button type="button" class="primary" onclick="saveSlip()">Save</button><button type="button" onclick="editor.close()">Cancel</button><button type="button" id="deleteBtn" class="danger" onclick="deleteCurrent()">Delete</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const DEMO=[{id:'R1',event:'Rocket Classic',book:'Fanatics',name:'Malnati / Moore / Power',odds:50000,wager:1,payout:501,cash:.10,betId:'26301209000039610',legs:['Peter Malnati','Taylor Moore','Seamus Power']},{id:'R2',event:'Rocket Classic',book:'Fanatics',name:'Si Woo / Hideki',odds:345,wager:5,payout:22.25,cash:.05,betId:'26301207000039610',legs:['Si Woo Kim','Hideki Matsuyama']},{id:'R3',event:'Rocket Classic',book:'Fanatics',name:'Dahmen / Bezuidenhout / Bridgeman / McCarthy / Ewart',odds:90000,wager:1,payout:901,cash:.10,betId:'26300550000019810',legs:['Joel Dahmen','Christiaan Bezuidenhout','Jacob Bridgeman','Denny McCarthy','A.J. Ewart']},{id:'R4',event:'Rocket Classic',book:'Fanatics',name:'Van Rooyen / Højgaard / Fishburn / Knapp',odds:50000,wager:1,payout:501,cash:.10,betId:'26300548000109910',legs:['Erik Van Rooyen','Rasmus Højgaard','Patrick Fishburn','Jake Knapp']},{id:'R5',event:'Rocket Classic',book:'Fanatics',name:'Grillo / Putnam / Mouw',odds:14000,wager:1,payout:141,cash:.09,betId:'26300547000049910',legs:['Emiliano Grillo','Andrew Putnam','William Mouw']}];
let slips=JSON.parse(localStorage.getItem('golfSlips')||'null')||structuredClone(DEMO),board={},editIndex=-1;
const N=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const money=x=>'$'+Number(x||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sc=x=>{if(x==null||x==='')return null;let t=String(x).trim().replace('−','-').toUpperCase();if(t==='E'||t==='EVEN')return 0;let n=parseInt(t.replace('+',''),10);return isNaN(n)?null:n};
const fmt=x=>x==null?'—':x>0?'+'+x:String(x);
function exposure(){let m={};slips.forEach(s=>s.legs.forEach(p=>m[p]=(m[p]||0)+1));return m}
function persist(){localStorage.setItem('golfSlips',JSON.stringify(slips));render()}
function render(){let exp=exposure(),risk=slips.reduce((a,s)=>a+Number(s.wager||0),0),pay=slips.reduce((a,s)=>a+Number(s.payout||0),0);summary.innerHTML=`<div class="sum"><span>Slips</span><b>${slips.length}</b></div><div class="sum"><span>Risk</span><b>${money(risk)}</b></div><div class="sum"><span>Max Return</span><b>${money(pay)}</b></div>`;
slipCards.innerHTML=slips.map((s,i)=>`<article class="slip"><div class="slipHead"><div><div class="slipTitle">${s.id||'S'+(i+1)} · ${s.name||s.legs.join(' / ')}</div><div class="slipMeta">${s.legs.length} Top-20 legs · Wager ${money(s.wager)} · Payout ${money(s.payout)}</div></div><div class="odds">+${Number(s.odds).toLocaleString()}<br><button class="editBtn" onclick="openEditor(${i})">Edit</button></div></div><div class="money"><div class="metric"><span>Wager</span><b>${money(s.wager)}</b></div><div class="metric"><span>Payout</span><b>${money(s.payout)}</b></div><div class="metric"><span>Cashout</span><b>${money(s.cash)}</b></div></div>${s.legs.map(p=>{let b=board[N(p)],t=sc(b?.total),r=sc(b?.today),bad=t!=null&&t>1,inside=b&&Number(String(b.rank||b.position||999).replace('T',''))<=20;return `<div class="leg"><div class="legTop"><span class="player">${p}</span><span class="pos">${b?.position||b?.rank||'—'}</span></div><div class="scores"><span>Total <b>${fmt(t)}</b></span><span>Round <b>${fmt(r)}</b></span><span>Thru <b>${b?.thru||'—'}</b></span></div><span class="pill ${bad?'miss':inside?'hit':b?'live':'wait'}">${bad?'ABOVE CUT':inside?'TOP 20':b?'LIVE':'WAITING'}</span></div>`}).join('')}</article>`).join('');
playerCards.innerHTML=Object.entries(exp).sort((a,b)=>{let pa=board[N(a[0])],pb=board[N(b[0])];return Number(String(pa?.rank||999).replace('T',''))-Number(String(pb?.rank||999).replace('T',''))||a[0].localeCompare(b[0])}).map(([p,n])=>{let b=board[N(p)],t=sc(b?.total),r=sc(b?.today),rank=Number(String(b?.rank||b?.position||999).replace('T','')),bad=t!=null&&t>1,inside=rank<=20;return `<article class="playerCard"><div class="pcTop"><div><div class="pcName">${p}</div><div class="slipMeta">On ${n} slip${n>1?'s':''}</div></div><div class="pcPos">${b?.position||b?.rank||'—'}</div></div><div class="pcGrid"><div class="pcStat"><span>Total</span><b>${fmt(t)}</b></div><div class="pcStat"><span>Round</span><b>${fmt(r)}</b></div><div class="pcStat"><span>Thru</span><b>${b?.thru||'—'}</b></div><div class="pcStat"><span>Status</span><b>${bad?'CUT':inside?'T20':b?'LIVE':'WAIT'}</b></div></div></article>`}).join('')}
function addLegRow(name=''){let d=document.createElement('div');d.className='legEdit';d.innerHTML=`<input class="legName" placeholder="Player name" value="${name.replaceAll('"','&quot;')}"><button type="button" class="danger" onclick="this.parentElement.remove()">×</button>`;legsEditor.appendChild(d)}
function openEditor(i=-1){editIndex=i;let s=i>=0?slips[i]:{event:'Rocket Classic',book:'Fanatics',odds:100,wager:1,payout:2,cash:0,betId:'',name:'',legs:['']};editorTitle.textContent=i>=0?'Edit Slip':'Add Slip';fEvent.value=s.event;fBook.value=s.book;fOdds.value=s.odds;fWager.value=s.wager;fPayout.value=s.payout;fCash.value=s.cash;fBet.value=s.betId||'';fName.value=s.name||'';legsEditor.innerHTML='';s.legs.forEach(addLegRow);deleteBtn.style.display=i>=0?'inline-block':'none';editor.showModal()}
function saveSlip(){let legs=[...document.querySelectorAll('.legName')].map(x=>x.value.trim()).filter(Boolean);if(!legs.length)return alert('Add at least one player');let s={id:editIndex>=0?slips[editIndex].id:'S'+(slips.length+1),event:fEvent.value.trim(),book:fBook.value.trim(),name:fName.value.trim()||legs.join(' / '),odds:+fOdds.value,wager:+fWager.value,payout:+fPayout.value,cash:+fCash.value,betId:fBet.value.trim(),legs};if(editIndex>=0)slips[editIndex]=s;else slips.push(s);editor.close();persist()}
function deleteCurrent(){if(editIndex>=0&&confirm('Delete this slip?')){slips.splice(editIndex,1);editor.close();persist()}}
function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(slips,null,2)],{type:'application/json'}));a.download='golf-slips.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;slips=x;persist()}catch(e){alert('Invalid slips file')}};r.readAsText(f)}
function resetDemo(){if(confirm('Replace current slips with the Rocket Classic set?')){slips=structuredClone(DEMO);persist()}}
async function scanImages(files){for(const file of files){feedStatus.textContent='Scanning '+file.name+'…';try{let out=await Tesseract.recognize(file,'eng');let parsed=parseSlipText(out.data.text);openEditor();fEvent.value=parsed.event||'Rocket Classic';fOdds.value=parsed.odds||100;fWager.value=parsed.wager||1;fPayout.value=parsed.payout||2;fCash.value=parsed.cash||0;fBet.value=parsed.betId||'';fName.value=parsed.players.join(' / ');legsEditor.innerHTML='';(parsed.players.length?parsed.players:['']).forEach(addLegRow);feedStatus.textContent='OCR complete — review and save'}catch(e){feedStatus.textContent='Could not scan image'}}imgInput.value=''}
function parseSlipText(t){let lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean),odds=+(t.match(/\+(\d{3,6})/)||[])[1]||100,wager=+(t.match(/Wager\s*\$?([\d.]+)/i)||[])[1]||1,payout=+(t.match(/Payout\s*\$?([\d.]+)/i)||[])[1]||2,cash=+(t.match(/Cash\s*\$?([\d.]+)/i)||[])[1]||0,betId=(t.match(/Bet\s*ID\s*:?\s*(\d+)/i)||[])[1]||'';let players=[];for(let i=0;i<lines.length;i++){if(/Top\s*20/i.test(lines[i])&&i>0){let p=lines[i-1].replace(/[^A-Za-zÀ-ÿ.'’\-\s]/g,'').trim();if(p&&p.length>3&&!/Sportsbook|Leg SGP|Wager|Payout|Cash/i.test(p))players.push(p)}}return{event:/Rocket Classic/i.test(t)?'Rocket Classic':'Golf Tournament',odds,wager,payout,cash,betId,players:[...new Set(players)]}}
function parseESPN(d){let ev=(d.events||[]).find(e=>/rocket/i.test(e.name||e.shortName||''))||d.events?.[0],rows=ev?.competitions?.[0]?.competitors||[];return Object.fromEntries(rows.map(c=>{let ls=c.linescores||[],round=[...ls].reverse().find(x=>x&&x.displayValue!==undefined)||{},holes=Array.isArray(round.linescores)?round.linescores.length:0,name=c.athlete?.displayName||c.displayName||'';return[N(name),{name,position:c.curatedRank?.current||c.rank||'',rank:c.curatedRank?.current||c.rank||999,total:c.score||'',today:round.displayValue||'',thru:holes>=18?'F':holes||''}]}))}
async function loadBoard(){feedStatus.textContent='Refreshing scores…';let urls=[boardUrl.value.trim()||'leaderboard.json','https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard'];for(const u of urls){try{let r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)continue;let d=await r.json();if(d.events)board=parseESPN(d);else{let rows=d.players||d.leaderboard||d.rows||d||[];board=Object.fromEntries(rows.map(x=>{let name=x.name||x.player||x.golfer;return[N(name),{name,position:x.position||x.pos||x.rank||'',rank:x.rank||x.position,total:x.total??x.score??'',today:x.today??x.roundScore??'',thru:x.thru??x.hole??''}]}))}if(Object.keys(board).length){feedStatus.innerHTML='<span class="live-dot">● LIVE DATA</span>';updated.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});render();return}}catch(e){}}feedStatus.textContent='Score feed unavailable';render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});render();loadBoard();setInterval(loadBoard,120000);
</script></body></html>
